# TTT-Discover on one Apple Silicon machine, serving and training on MLX.
#
# The whole stack is a single process: `reef serve` starts the service, and
# the `mlx` runtime holds the base model, the LoRA adapter and the optimizer
# inside it. There is no Ray head, no training driver, and no CUDA.
#
# This is a smoke, not a reproduction. The paper's run is Qwen3-8B with an
# 8x64 grid; the grid here is deliberately tiny so a laptop finishes a step in
# under a minute. See README.md for what it does and does not demonstrate.

run_dir: work/stack
ready_timeout: 600

reef:
  host: 127.0.0.1
  port: 8901
  # Any mlx-community repo id or a local converted model directory.
  model_path: mlx-community/Qwen2.5-0.5B-Instruct-4bit
  recipe: recipes.tttd.recipe:TTTDRecipe
  token: reef-local

  # The TTTD grid. run.py reads the same two values, so the harness and the
  # scenario cannot disagree about what a complete step is.
  groups_per_step: 2
  rollouts_per_group: 4

  # Publish every step, so each training step produces an inspectable adapter
  # artifact rather than only moving live weights.
  checkpoint_every_n_versions: 1

  runtime_type: mlx
  runtime_config:
    checkpoint_dir: work/checkpoints
    # Adapter capacity and the memory it costs.
    lora_layers: 8
    lora_rank: 8
    lora_scale: 2.0
    learning_rate: 1.0e-4
    # Generation bounds: unified memory scales with (group size x max_tokens).
    max_tokens: 96
    temperature: 1.0
    # TTT-Discover's frozen-base KL coefficient (the paper's --kl-coef).
    kl_coef: 0.1
    # Sequences per backward pass. Lower this first if a step runs out of
    # unified memory; the step then accumulates over more micro-batches.
    micro_batch_size: 4
    seed: 0

  inference_timeout_s: 600
  train_timeout_s: 3600
  artifact_repository: work/artifacts.git
  artifact_work_dir: work/artifact-work
  artifact_cache_dir: work/artifact-cache
  agent_record_dir: work/agent-record

observability:
  wandb:
    enabled: false

services:
  - name: reef
    command: ["${REEF_PYTHON}", "-m", "reef.service"]
    ready: curl -sf http://127.0.0.1:8901/healthz
    ready_timeout: 600
